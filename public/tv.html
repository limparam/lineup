<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Экран для TV — LineUP</title>
  <meta name="theme-color" content="#05070a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/tv.css?v=6">
</head>
<body>
  <main class="tv" id="tv">
    <header class="tv-head">
      <span class="tv-event" id="tv-event"></span>
      <span class="tv-hall" id="tv-hall"></span>
    </header>
    <section class="tv-stage" id="tv-stage">
      <div class="tv-loading">Загрузка расписания…</div>
    </section>
    <footer class="tv-foot">
      <div class="tv-next" id="tv-next" hidden>
        <span class="tv-next__label">Далее</span>
        <span class="tv-next__name" id="tv-next-name"></span>
        <span class="tv-next__time" id="tv-next-time"></span>
      </div>
    </footer>
  </main>
  <script type="module" src="/assets/tv.js?v=5"></script>
</body>
</html>
