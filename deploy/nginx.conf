# LineUP — пример конфигурации nginx.
#
# 1. Замените lineup.example на своё домен.
# 2. Пути /var/www/lineup/public и сертификаты — на свои.
# 3. Положите файл в /etc/nginx/sites-available/lineup и включите:
#      ln -s /etc/nginx/sites-available/lineup /etc/nginx/sites-enabled/lineup
#      nginx -t && systemctl reload nginx
#
# Приложение слушает 127.0.0.1:8000 (gunicorn, см. deploy/lineup.service).

upstream lineup_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP -> HTTPS. Оставьте /.well-known для выпуска сертификата.
server {
    listen 80;
    listen [::]:80;
    server_name lineup.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                  # nginx >= 1.25.1; для старых: listen 443 ssl http2;
    server_name lineup.example;

    ssl_certificate     /etc/letsencrypt/live/lineup.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineup.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    root  /var/www/lineup/public;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Статику отдаёт nginx напрямую — так быстрее.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # Всё остальное — приложению.
    location / {
        proxy_pass http://lineup_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # X-Forwarded-For клиент может подделать; приложение берёт последний
        # адрес, который добавляет nginx. Не заменяйте на $remote_addr без
        # необходимости — тогда это тоже будет работать.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_redirect off;
    }
}
